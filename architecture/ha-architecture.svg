<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Highly available three-tier architecture on AWS</title>
  <desc>Internet users reach an internet gateway and an Application Load Balancer in public subnets across two availability zones. Web servers in an Auto Scaling group sit in private app subnets and connect to RDS MySQL in a private database subnet.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="610" fill="#ffffff"/>

  <rect x="310" y="15" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="380" y="37" text-anchor="middle" font-size="13" fill="#111827">Internet users</text>
  <line x1="380" y1="49" x2="380" y2="63" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="65" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="380" y="87" text-anchor="middle" font-size="13" fill="#111827">Internet gateway</text>

  <rect x="30" y="125" width="700" height="470" rx="14" fill="none" stroke="#6b7280" stroke-dasharray="7 5"/>
  <text x="44" y="144" font-size="13" font-weight="bold" fill="#111827">VPC 10.0.0.0/16 (ap-south-1)</text>
  <text x="200" y="164" text-anchor="middle" font-size="12" fill="#374151">Availability zone ap-south-1a</text>
  <text x="560" y="164" text-anchor="middle" font-size="12" fill="#374151">Availability zone ap-south-1b</text>

  <rect x="50" y="175" width="300" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="60" y="193" font-size="12" fill="#085041">public-subnet-a</text>
  <rect x="410" y="175" width="300" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="700" y="193" text-anchor="end" font-size="12" fill="#085041">public-subnet-b</text>

  <rect x="65" y="215" width="130" height="44" rx="6" fill="#ffffff" stroke="#0f6e56"/>
  <text x="130" y="241" text-anchor="middle" font-size="13" fill="#111827">NAT gateway</text>
  <rect x="215" y="215" width="345" height="44" rx="6" fill="#ffffff" stroke="#0f6e56"/>
  <text x="387" y="241" text-anchor="middle" font-size="13" fill="#111827">Application Load Balancer (ha-alb)</text>
  <line x1="380" y1="99" x2="380" y2="213" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="315" width="300" height="105" rx="8" fill="#eeedfe" stroke="#534ab7"/>
  <text x="60" y="333" font-size="12" fill="#3c3489">private-app-subnet-a</text>
  <rect x="410" y="315" width="300" height="105" rx="8" fill="#eeedfe" stroke="#534ab7"/>
  <text x="700" y="333" text-anchor="end" font-size="12" fill="#3c3489">private-app-subnet-b</text>

  <rect x="190" y="350" width="150" height="44" rx="6" fill="#ffffff" stroke="#534ab7"/>
  <text x="265" y="376" text-anchor="middle" font-size="13" fill="#111827">EC2 web server</text>
  <rect x="440" y="350" width="150" height="44" rx="6" fill="#ffffff" stroke="#534ab7"/>
  <text x="515" y="376" text-anchor="middle" font-size="13" fill="#111827">EC2 web server</text>
  <text x="380" y="411" text-anchor="middle" font-size="11" fill="#3c3489">Auto Scaling group ha-web-asg (min 2, max 4)</text>
  <line x1="265" y1="259" x2="265" y2="348" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="515" y1="259" x2="515" y2="348" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="440" width="300" height="105" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text x="60" y="458" font-size="12" fill="#712b13">private-db-subnet-a</text>
  <text x="200" y="500" text-anchor="middle" font-size="11" font-style="italic" fill="#712b13">no standby instance (single-AZ)</text>
  <rect x="410" y="440" width="300" height="105" rx="8" fill="#faece7" stroke="#993c1d"/>
  <text x="700" y="458" text-anchor="end" font-size="12" fill="#712b13">private-db-subnet-b</text>
  <rect x="440" y="475" width="150" height="44" rx="6" fill="#ffffff" stroke="#993c1d"/>
  <text x="515" y="501" text-anchor="middle" font-size="13" fill="#111827">RDS MySQL</text>
  <line x1="515" y1="394" x2="515" y2="473" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="380" y="575" text-anchor="middle" font-size="11" fill="#374151">public-rt: 0.0.0.0/0 to IGW  |  private-app-rt: 0.0.0.0/0 to NAT  |  private-db-rt: local only</text>

  <rect x="745" y="125" width="145" height="290" rx="10" fill="#f9fafb" stroke="#6b7280"/>
  <text x="817" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Operations</text>
  <text x="817" y="178" text-anchor="middle" font-size="12" fill="#111827">CloudWatch logs</text>
  <text x="817" y="206" text-anchor="middle" font-size="12" fill="#111827">CloudWatch metrics</text>
  <text x="817" y="234" text-anchor="middle" font-size="12" fill="#111827">Alarms + SNS email</text>
  <text x="817" y="262" text-anchor="middle" font-size="12" fill="#111827">Dashboard</text>
  <text x="817" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Access and secrets</text>
  <text x="817" y="328" text-anchor="middle" font-size="12" fill="#111827">Session Manager</text>
  <text x="817" y="356" text-anchor="middle" font-size="12" fill="#111827">Parameter Store</text>
  <text x="817" y="384" text-anchor="middle" font-size="12" fill="#111827">IAM instance role</text>

  <rect x="745" y="440" width="145" height="105" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="817" y="462" text-anchor="middle" font-size="11" fill="#374151">Security groups</text>
  <text x="817" y="484" text-anchor="middle" font-size="11" fill="#374151">internet to alb-sg</text>
  <text x="817" y="502" text-anchor="middle" font-size="11" fill="#374151">alb-sg to app-sg</text>
  <text x="817" y="520" text-anchor="middle" font-size="11" fill="#374151">app-sg to db-sg</text>
</svg>
